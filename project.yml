name: Sesh
options:
  bundleIdPrefix: me.pecheny
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B5T934YFU5
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    OTHER_LDFLAGS: -lstdc++

targets:
  Sesh:
    type: application
    platform: iOS
    sources:
      - path: Sesh
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/Icons.xcassets
      - path: Resources/licenses.json
    dependencies:
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - framework: Frameworks/SeshCore.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.sesh
        INFOPLIST_FILE: Sesh/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sesh/Sesh.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sesh/Sesh-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
