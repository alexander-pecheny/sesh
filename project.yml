name: Sesh
options:
  bundleIdPrefix: me.pecheny
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B5T934YFU5
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    OTHER_LDFLAGS: -lstdc++

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  cmark:
    url: https://github.com/swiftlang/swift-cmark
    exactVersion: 0.9.0

targets:
  Sesh:
    type: application
    platform: iOS
    sources:
      - path: Sesh
      - path: Shared
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/Icons.xcassets
      - path: Resources/Fixtures
        type: folder
        buildPhase: resources
      - path: Resources/licenses.json
      - path: Resources/helpers.json
    dependencies:
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - framework: Frameworks/SeshCore.xcframework
        embed: false
      - package: MarkdownUI
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.sesh
        INFOPLIST_FILE: Sesh/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sesh/Sesh.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sesh/Sesh-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures

  SeshMac:
    type: application
    platform: macOS
    sources:
      - path: SeshMac
      - path: Shared
      - path: Resources/Icons.xcassets
      - path: Resources/helpers.json
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - package: MarkdownUI
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_NAME: Sesh
        PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.sesh.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: MacIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
      configs:
        # A Debug build keeps its own settings and Vault copies, apart from the installed app.
        Debug:
          PRODUCT_NAME: Sesh Dev
          PRODUCT_BUNDLE_IDENTIFIER: me.pecheny.sesh.mac.dev
