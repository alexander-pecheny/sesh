[package]
name = "sesh-core"
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
log = "0.4"
mosh = { path = "../../vendor/rmosh/crates/mosh" }
mosh-client = { path = "../../vendor/rmosh/crates/mosh-client" }
mosh-sys = { path = "../../vendor/rmosh/crates/mosh-sys" }
russh-sftp = "3"
russh = { version = "0.54", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
